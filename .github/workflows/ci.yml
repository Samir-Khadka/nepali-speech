name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt -r backend/requirements-test.txt
      - name: Run tests
        working-directory: backend
        run: pytest -q

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r benchmark/requirements.txt pytest
      - name: Run benchmark tests
        run: pytest benchmark/tests/ -q

  training:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # CPU-only torch FIRST, from the PyTorch CPU index. A plain
      # `pip install -r training/requirements.txt` would pull the
      # multi-GB CUDA torch wheels (training/requirements.txt pins
      # torch==2.15.0+cpu for reference only). With torch already
      # installed from the CPU index, pip sees the pin as satisfied
      # and does not re-fetch it. Same rule as
      # benchmark/requirements-eval.txt and training/README.md §0.
      - name: Install CPU-only torch first
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Install training dependencies
        run: |
          pip install -r training/requirements.txt pytest
      - name: Run training tests
        run: pytest training/tests/ -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build
        working-directory: frontend
        run: npm run build
