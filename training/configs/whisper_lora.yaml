# Whisper LoRA config — validated by training/config.py::validate_lora_config
# before any model is touched. Smoke runs override steps/clips/batch on the
# CLI; the values here are the defaults for a real run.
lora_r: 8
lora_alpha: 16
lora_dropout: 0.05
# Whisper attention projections. q/v only is the standard minimal LoRA
# target set; add k_proj/out_proj for a wider adapter (more capacity,
# slower). Keep in sync with train_config.json when you change this.
target_modules:
  - q_proj
  - v_proj
learning_rate: 0.0001
per_device_train_batch_size: 4
num_train_epochs: 3
warmup_ratio: 0.03
logging_steps: 10
save_steps: 100
